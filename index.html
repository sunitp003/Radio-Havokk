        function buildInterfaceGrid() {
            gridNode.innerHTML = '';
            
            const datasets = radioDatabase.filter(item => {
                const isFav = favoritesList.includes(item.name);
                
                let filterMatch = false;
                if (activeTagFilter === 'all') filterMatch = true;
                else if (activeTagFilter === 'favorites') filterMatch = isFav;
                else filterMatch = item.tags.includes(activeTagFilter);

                const stringMatch = item.name.toLowerCase().includes(filterSearchText.toLowerCase()) || 
                                    item.tags.some(tag => tag.toLowerCase().includes(filterSearchText.toLowerCase()));
                return filterMatch && stringMatch;
            });

            if (datasets.length === 0) {
                gridNode.innerHTML = `<div class="col-span-full py-16 text-center text-sm text-slate-500 font-medium">No stations found matching filters.</div>`;
                return;
            }

            datasets.forEach((data) => {
                const card = document.createElement('div');
                const rawDbIndex = radioDatabase.findIndex(x => x.link === data.link && x.name === data.name);
                const isFav = favoritesList.includes(data.name);
                
                card.className = `station-card border border-slate-800 bg-slate-900/40 p-4 rounded-xl flex items-center justify-between gap-4 transition-all relative`;
                
                if(globalActiveIndex === rawDbIndex) {
                    card.classList.add('active-card');
                }

                let playBtnSymbol = '▶';
                if (globalActiveIndex === rawDbIndex && isPlayingState) {
                    playBtnSymbol = '⏸';
                }

                let chips = '';
                data.tags.slice(0, 2).forEach(tag => {
                    if(tag) chips += `<span class="bg-slate-950 border border-slate-800/60 text-slate-500 text-[9px] px-1.5 py-0.5 rounded font-mono">${tag}</span>`;
                });

                const imgMarkup = data.logo ? 
                    `<img src="${data.logo}" class="w-10 h-10 rounded-lg object-cover bg-slate-950 border border-slate-800 shrink-0" alt="Logo">` : 
                    `<div class="w-10 h-10 rounded-lg bg-slate-950 border border-slate-800 flex items-center justify-center text-xl shrink-0">📻</div>`;

                card.innerHTML = `

                        bootStreamEngine(data, rawDbIndex);
                    }

                card.querySelector('.fav-btn').addEventListener('click', () => {
                    toggleFavorite(data.name);
                });

                gridNode.appendChild(card);
            });

        function toggleFavorite(stationName) {
            const idx = favoritesList.indexOf(stationName);
            if (idx > -1) {
                favoritesList.splice(idx, 1);
            } else {
                favoritesList.push(stationName);
            }
            localStorage.setItem('radioFavorites', JSON.stringify(favoritesList));
            buildInterfaceGrid();
        }

        async function runMatrixResolution(url) {
            if (!url.includes('cloudfront.net') && !url.includes('bitgravity.com')) return url;
            footerSubtitleNode.textContent = "Checking primary matrix cluster...";
            try {
                const controller = new AbortController();
                setTimeout(() => controller.abort(), 2000);
                const res = await fetch(url, { method: 'HEAD', signal: controller.signal });
                if (res.status === 200) return url;
            } catch(e) {}

            footerSubtitleNode.textContent = "Resolving fallback servers...";
            for (let chunk of clusters) {
                let cleanUrl = url;
                if(url.includes('cloudfront.net')) {
                    cleanUrl = url.replace(/https:\/\/[^\/]+/, `https://${chunk}.cloudfront.net`);
                } else if (url.includes('bitgravity.com')) {
                    cleanUrl = url.replace(/https:\/\/[^\/]+/, `https://${chunk}.pc.cdn.bitgravity.com`);
                }
                try {
                    const ctrl = new AbortController();
                    setTimeout(() => ctrl.abort(), 1500);
                    const test = await fetch(cleanUrl, { method: 'HEAD', signal: ctrl.signal });
                    if (test.status === 200) return cleanUrl;
                } catch(err) {}
            }
            return url;
        }

        async function bootStreamEngine(item, databaseIndex) {
            globalActiveIndex = databaseIndex;
            isPlayingState = false;
            buildInterfaceGrid();

            if (currentHlsEngineInstance) {
                currentHlsEngineInstance.destroy();
                currentHlsEngineInstance = null;
            }
            audioEngineNode.pause();
            audioEngineNode.src = '';

            footerTitleNode.textContent = item.name;
            footerSubtitleNode.textContent = "Connecting to transmission link...";
            waveIconNode.textContent = "⏳";
            waveIconNode.className = "w-10 h-10 bg-slate-950 border border-emerald-500/20 rounded-lg flex items-center justify-center text-lg text-emerald-400 animate-pulse";

            const targetStreamRoute = await runMatrixResolution(item.link);

            if (targetStreamRoute.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    currentHlsEngineInstance = new Hls({
                        maxBufferSize: 0, maxBufferLength: 10, liveSyncDuration: 6, liveMaxLatencyDuration: 12
                    });
                    currentHlsEngineInstance.loadSource(targetStreamRoute);
                    currentHlsEngineInstance.attachMedia(audioEngineNode);
                    
                    currentHlsEngineInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        audioEngineNode.play().then(() => triggerPlayStateUI()).catch(() => triggerErrorStateUI());
                    });
                    currentHlsEngineInstance.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) currentHlsEngineInstance.loadSource(item.link);
                    });
                } else if (audioEngineNode.canPlayType('application/vnd.apple.mpegurl')) {
                    audioEngineNode.src = targetStreamRoute;
                    audioEngineNode.play().then(() => triggerPlayStateUI()).catch(() => triggerErrorStateUI());
                } else {
                    footerSubtitleNode.textContent = "HLS stream execution failure.";
                }
            } else {
                audioEngineNode.src = targetStreamRoute;
                audioEngineNode.play().then(() => triggerPlayStateUI()).catch(() => triggerErrorStateUI());
            }
        }

        function triggerPlayStateUI() {
            isPlayingState = true;
            footerSubtitleNode.textContent = "Playing Live Broadcast Channel";
            waveIconNode.textContent = "🎵";
            waveIconNode.className = "w-10 h-10 bg-emerald-950 border border-emerald-500/40 rounded-lg flex items-center justify-center text-lg text-emerald-400 animate-bounce";
            bottomPlayPauseBtn.textContent = "⏸ Pause";
            bottomPlayPauseBtn.className = "bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm px-4 py-1.5 rounded-lg transition-colors shadow-md";
            syncCardPlayButtons();
        }

        function triggerPauseStateUI() {
            isPlayingState = false;
            footerSubtitleNode.textContent = "Broadcast Paused";
            waveIconNode.textContent = "⏸";
            waveIconNode.className = "w-10 h-10 bg-slate-900 border border-slate-700 rounded-lg flex items-center justify-center text-lg text-slate-400";
            bottomPlayPauseBtn.textContent = "▶ Play";
            bottomPlayPauseBtn.className = "bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm px-4 py-1.5 rounded-lg transition-colors shadow-md";
            syncCardPlayButtons();
        }

        function triggerErrorStateUI() {
            isPlayingState = false;
            footerSubtitleNode.textContent = "Playback failed or stream offline.";
            waveIconNode.textContent = "❌";
            waveIconNode.className = "w-10 h-10 bg-red-950 border border-red-500/30 rounded-lg flex items-center justify-center text-lg text-red-400";
            buildInterfaceGrid();
        }

        function syncCardPlayButtons() {
            document.querySelectorAll('.station-card').forEach((card) => {
                const playBtn = card.querySelector('.play-btn');
                if (card.classList.contains('active-card') && playBtn) {
                    playBtn.textContent = isPlayingState ? '⏸' : '▶';
                } else if (playBtn) {
                    playBtn.textContent = '▶';
                }
            });
        }

        bottomPlayPauseBtn.addEventListener('click', () => {
            if (globalActiveIndex === null) return;
            if (isPlayingState) {
                audioEngineNode.pause();
            } else {
                audioEngineNode.play().then(() => triggerPlayStateUI()).catch(() => triggerErrorStateUI());
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audioEngineNode.volume = e.target.value;
        });

        audioEngineNode.addEventListener('play', () => { if(!isPlayingState) triggerPlayStateUI(); });
        audioEngineNode.addEventListener('pause', () => { if(isPlayingState) triggerPauseStateUI(); });

        searchNode.addEventListener('input', (e) => {
            filterSearchText = e.target.value;
            buildInterfaceGrid();
        });

        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-tab').forEach(t => {
                    t.className = "filter-tab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200";
                });
                
                if (e.target.dataset.target === 'favorites') {
                    e.target.className = "filter-tab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-rose-600 text-white shadow-md";
                } else {
                    e.target.className = "filter-tab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-emerald-600 text-white shadow-md";
                }
                
                activeTagFilter = e.target.dataset.target;
                buildInterfaceGrid();
            });
        });

        buildInterfaceGrid();
