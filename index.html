<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Havvok</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Hls.js Stable Library Engine -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- PWA Web Manifest Configuration -->
    <link rel="manifest"
        href='data:application/json,{"name":"RadioHavokk","short_name":"RadioHavokk","description":"All India Radio Fallback Grid Engine","start_url":".","display":"standalone","background_color":"#020617","theme_color":"#10b981","orientation":"portrait","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📻</text></svg>","sizes":"512x512","type":"image/svg+xml"}]}' />

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-24">

    <!-- Navbar Layout Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="text-3xl">📻</div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-emerald-400 flex items-center gap-2">
                        Radio Havokk <span
                            class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-mono uppercase">V2.0</span>
                    </h1>
                    <p class="text-xs text-slate-400">All India Radio Fallback Grid Engine</p>
                </div>
            </div>

            <!-- Search Inputs Bar -->
            <div class="relative w-full sm:w-72 md:w-80">
                <input type="text" id="globalSearch" placeholder="Search by name, tag..."
                    class="w-full bg-slate-950/80 border border-slate-700 rounded-lg pl-9 pr-4 py-1.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-200 transition-colors">
                <span class="absolute left-3 top-2.5 text-slate-500 text-xs">🔍</span>
            </div>
        </div>
    </header>

    <!-- Content Workspace -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col gap-4">

        <!-- Filter Tabs Wrapper -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar" id="tabFilterLayout">
            <button
                class="filter-tab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-emerald-600 text-white shadow-md"
                data-target="all">All Stations</button>
            <button
                class="filter-tab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-rose-400 hover:bg-slate-700"
                data-target="favorites">❤️ Favorites</button>
            <button
                class="filter-tab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200"
                data-target="Akashvani">Akashvani</button>
            <button
                class="filter-tab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200"
                data-target="Marathi">Marathi</button>
            <button
                class="filter-tab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200"
                data-target="Bollywood">Bollywood</button>
            <button
                class="filter-tab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200"
                data-target="Retro">Retro</button>
            <button
                class="filter-tab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200"
                data-target="90s">90s</button>
            <button
                class="filter-tab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200"
                data-target="00s">00s</button>
            <button
                class="filter-tab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200"
                data-target="Modern">Modern</button>
        </div>

        <!-- Dynamic Content Response Area Grid -->
        <div id="cardsLayoutGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Render cards via js layout -->
        </div>
    </main>

    <!-- Universal Sticky Bottom Control Dock -->
    <div
        class="fixed bottom-0 left-0 right-0 bg-slate-900/90 border-t border-slate-800/80 shadow-2xl px-4 py-3 z-50 backdrop-blur-lg">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">

            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div id="playingWaveIcon"
                    class="w-10 h-10 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center text-lg text-slate-400">
                    ⚡</div>
                <div class="overflow-hidden max-w-[280px]">
                    <h4 id="footerTitle" class="font-bold text-sm text-slate-200 truncate">No Active Station</h4>
                    <p id="footerSubtitle" class="text-xs text-slate-400 truncate mt-0.5">Select a station play button
                    </p>
                </div>
            </div>

            <!-- Custom Clean Control Bar without Timeline -->
            <div class="flex items-center gap-4 w-full sm:w-auto">
                <button id="bottomPlayPauseBtn"
                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm px-4 py-1.5 rounded-lg transition-colors shadow-md">
                    ▶ Play
                </button>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400">🔊</span>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1"
                        class="w-24 sm:w-32 accent-emerald-500 h-1.5 bg-slate-700 rounded-lg cursor-pointer">
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Native Audio Node Container Interface -->
    <audio id="audioStreamingEngine" class="hidden"></audio>

    <!-- Core Interactive Client Logic JS -->
    <script src="script.js"></script>
</body>

</html>
